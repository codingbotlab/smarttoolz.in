name: Add Knowledge Base links to tools

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add matching guide link
        shell: python
        run: |
          from pathlib import Path
          p = Path('smart-toolz/header.php')
          text = p.read_text(encoding='utf-8')
          marker = '</ol>\n<?php if ($isToolPage && !$isLoggedIn && $guestTrialEnabled && $guestTrialTotal > 0): ?>'
          insert = '''</ol>\n<?php if ($isToolPage): ?>\n<a class="kb-guide-link" href="/knowledge-base/<?= rawurlencode($slug) ?>/article/" title="Read the detailed <?= htmlspecialchars($toolTitle, ENT_QUOTES, 'UTF-8') ?> guide"><span class="material-symbols-rounded">menu_book</span><span>Detailed Guide</span><span class="material-symbols-rounded kb-arrow">arrow_forward</span></a>\n<?php endif; ?>\n<?php if ($isToolPage && !$isLoggedIn && $guestTrialEnabled && $guestTrialTotal > 0): ?>'''
          if marker in text and 'class="kb-guide-link"' not in text:
              text = text.replace(marker, insert, 1)
          css = '.kb-guide-link{display:flex;align-items:center;gap:7px;margin-top:11px;padding:10px 12px;border:1px solid #e2e5ee;border-radius:10px;background:#fff;color:#4f46d9;text-decoration:none;font-size:11px;font-weight:850;transition:.18s}.kb-guide-link:hover{background:#f4f2ff;border-color:#d8d4ff;transform:translateY(-1px)}.kb-guide-link .material-symbols-rounded{font-size:17px}.kb-guide-link .kb-arrow{margin-left:auto;font-size:16px}'
          if 'kb-guide-link{' not in text:
              text = text.replace('</style>', css + '</style>', 1)
          p.write_text(text, encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "smarttoolz-kb-link"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/add-kb-links.yml
          git add smart-toolz/header.php
          git commit -m "feat: link each tool to its knowledge base guide"
          git push
