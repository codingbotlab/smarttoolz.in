name: Add Knowledge Base Links to Tools

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/add-tool-kb-links.yml'

permissions:
  contents: write

jobs:
  add-kb-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add missing KB links
        shell: python
        run: |
          from pathlib import Path
          import re

          tools = Path('smart-toolz/tools')
          changed = []
          for path in sorted(tools.glob('*.php')):
              if path.name in {'tool-guide-link.php'}:
                  continue
              slug = path.stem
              text = path.read_text(encoding='utf-8')
              guide = f'/knowledge-base/{slug}/article/'
              if guide in text:
                  continue
              title = re.sub(r'[-_]+', ' ', slug).title()
              link = (f'<div class="smarttoolz-kb-guide" style="margin:0 0 20px;padding:14px 16px;border:1px solid #dedcff;border-radius:14px;background:#f7f6ff">'
                      f'<a href="{guide}" aria-label="Read the detailed {title} guide" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:#4f46d8;font-weight:800">'
                      f'<span>📖 Read the Detailed {title} Guide →</span><small style="color:#6b7280;font-size:12px;font-weight:600">Step-by-step instructions, tips &amp; visual walkthrough</small></a></div>')
              match = re.search(r'(<body(?:\s[^>]*)?>)', text, flags=re.I)
              if match:
                  pos = match.end()
                  text = text[:pos] + '\n' + link + '\n' + text[pos:]
              else:
                  text = link + '\n' + text
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))
          print(f'Updated {len(changed)} tool pages')
          for item in changed:
              print(item)

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet -- smart-toolz/tools; then
            echo 'No missing Knowledge Base links found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-toolz/tools/*.php
          git commit -m 'Add Knowledge Base links to all tool pages'
          git push
