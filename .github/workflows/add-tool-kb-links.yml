name: Add Knowledge Base Links to Tools

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/add-tool-kb-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-kb-links:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add missing Knowledge Base links
        shell: python
        run: |
          from pathlib import Path
          import re
          tools = Path('smart-toolz/tools')
          changed = []
          for path in sorted(tools.glob('*.php')):
              if path.name == 'tool-guide-link.php':
                  continue
              text = path.read_text(encoding='utf-8')
              slug = path.stem
              guide = f'/knowledge-base/{slug}/article/'
              if guide in text:
                  continue
              title = re.sub(r'[-_]+', ' ', slug).title()
              link = (f'<div class="smarttoolz-kb-guide" style="margin:0 0 20px;padding:14px 16px;border:1px solid #dedcff;border-radius:14px;background:#f7f6ff">'
                      f'<a href="{guide}" aria-label="Read the detailed {title} guide" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:#4f46d8;font-weight:800">'
                      f'<span>📖 Read the Detailed {title} Guide →</span><small style="color:#6b7280;font-size:12px;font-weight:600">Step-by-step instructions, tips &amp; visual walkthrough</small></a></div>')
              m = re.search(r'<body(?:\s[^>]*)?>', text, re.I)
              if m:
                  text = text[:m.end()] + '\n' + link + '\n' + text[m.end():]
              else:
                  text = link + '\n' + text
              path.write_text(text, encoding='utf-8')
              changed.append(path.name)
          print(f'Updated {len(changed)} tool pages')
          for item in changed: print(item)
      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet -- smart-toolz/tools; then echo 'No missing KB links.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-toolz/tools/*.php
          git commit -m 'Add Knowledge Base links to all tool pages'
          git push
