name: Apply Admin Advanced Analytics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[admin-advanced-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch admin index
        run: python scripts/patch-admin-advanced.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-toolz/admin/index.php
          if git diff --cached --quiet; then
            echo "No admin changes needed."
            exit 0
          fi
          git commit -m "Add advanced compact admin analytics [admin-advanced-fixed]"
          git push
