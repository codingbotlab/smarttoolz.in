name: Apply Analytics Geo Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[geo-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch analytics
        run: python scripts/patch-analytics-geo.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/tracker.php analytics/index.php
          if git diff --cached --quiet; then
            echo "No analytics changes needed."
            exit 0
          fi
          git commit -m "Fix analytics country detection [geo-fixed]"
          git push
