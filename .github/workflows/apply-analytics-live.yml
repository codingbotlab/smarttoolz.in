name: Apply Analytics Realtime Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[live-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch analytics
        run: python scripts/patch-analytics-live.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/index.php analytics/live.php scripts/patch-analytics-live.py .github/workflows/apply-analytics-live.yml
          if git diff --cached --quiet; then
            echo "No analytics live changes needed."
            exit 0
          fi
          git commit -m "Enable 1-second realtime analytics [live-fixed]"
          git push
