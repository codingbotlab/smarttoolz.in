name: Apply global favicon fonts

on:
  push:
    paths:
      - '.github/workflows/apply-global-fonts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Link global font list to both favicon pages
        shell: pwsh
        run: |
          $files = @(
            'smart-toolz/tools/favicon-generator.php',
            'smart-toolz/tools/favicon-ico-generator.php'
          )
          $tag = '<script src="/smart-toolz/assets/global-fonts.js?v=1" defer></script>'
          foreach ($file in $files) {
            $s = Get-Content $file -Raw -Encoding UTF8
            if ($s -notmatch [regex]::Escape('/smart-toolz/assets/global-fonts.js')) {
              $s = $s -replace '</head>', "$tag`n</head>", 1
              Set-Content $file $s -Encoding UTF8 -NoNewline
            }
          }
      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-toolz/tools/favicon-generator.php smart-toolz/tools/favicon-ico-generator.php
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Link global font list to both favicon tools'
            git push
          }
      - name: Remove one-time workflow
        if: success()
        shell: pwsh
        run: |
          git rm .github/workflows/apply-global-fonts.yml
          git commit -m 'Remove one-time favicon font linker'
          git push
