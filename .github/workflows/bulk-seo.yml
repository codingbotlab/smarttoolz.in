name: SmartToolz Site Automation

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  maintain:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-site-automation]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Compile Less to CSS
        shell: bash
        run: |
          set -euo pipefail
          npx --yes less@4.9.0 assets/less/smarttoolz.less assets/css/smarttoolz.css --clean-css
          test -s assets/css/smarttoolz.css

      - name: Normalize tool document shells and generate sitemap
        shell: python
        run: |
          from pathlib import Path
          import re
          from xml.etree import ElementTree as ET

          root = Path('.')
          tools_root = root / 'tools'
          header_patterns = [
              r'<\?php\s*require(?:_once)?\s+dirname\(__DIR__\)\s*\.\s*[\'\"]\/header\.php[\'\"]\s*;?\s*\?>',
              r'<\?php\s*require(?:_once)?\s+__DIR__\s*\.\s*[\'\"]\/\.\.\/header\.php[\'\"]\s*;?\s*\?>',
          ]
          footer_patterns = [
              r'<\?php\s*require(?:_once)?\s+dirname\(__DIR__\)\s*\.\s*[\'\"]\/footer\.php[\'\"]\s*;?\s*\?>',
              r'<\?php\s*require(?:_once)?\s+__DIR__\s*\.\s*[\'\"]\/\.\.\/footer\.php[\'\"]\s*;?\s*\?>',
          ]
          head_patterns = [
              r'<\?php\s*require(?:_once)?\s+dirname\(__DIR__\)\s*\.\s*[\'\"]\/head\.php[\'\"]\s*;?\s*\?>',
              r'<\?php\s*require(?:_once)?\s+__DIR__\s*\.\s*[\'\"]\/\.\.\/head\.php[\'\"]\s*;?\s*\?>',
          ]
          def strip(text, patterns):
              for p in patterns:
                  text = re.sub(p, '\n', text, flags=re.I)
              return text
          def insert_after(text, tag_pattern, include):
              text = re.sub(re.escape(include), '', text)
              m = re.search(tag_pattern, text, flags=re.I)
              return text if not m else text[:m.end()] + '\n' + include + '\n' + text[m.end():]
          def insert_before(text, tag_pattern, include):
              text = re.sub(re.escape(include), '', text)
              m = re.search(tag_pattern, text, flags=re.I)
              return text if not m else text[:m.start()] + '\n' + include + '\n' + text[m.start():]

          changed=[]
          for page in sorted(tools_root.rglob('*.php')) if tools_root.is_dir() else []:
              if page.name in {'header.php','footer.php','bootstrap.php','tool-sidebar.php','head.php'}:
                  continue
              text=page.read_text(encoding='utf-8')
              original=text
              text=strip(text,header_patterns)
              text=strip(text,footer_patterns)
              text=strip(text,head_patterns)
              text=re.sub(r'<link[^>]+href=[\'\"]https://cdn\.jsdelivr\.net/npm/bootstrap@[^\'\"]+/dist/css/bootstrap\.min\.css[\'\"][^>]*>\s*','',text,flags=re.I)
              text=re.sub(r'<link[^>]+href=[\'\"]\/assets\/css\/smarttoolz\.css[\'\"][^>]*>\s*','',text,flags=re.I)
              text=text.replace('/smart-toolz/tools/','/tools/').replace('/smart-toolz/tool.php','/tool.php')
              text=text.replace('Smart-Tooz','SmartToolz').replace('Smart Tooz','SmartToolz')
              text=text.replace('smarttooz','smarttoolz').replace('smartTooz','smartToolz')
              if re.search(r'<html\b',text,re.I) and re.search(r'<head\b',text,re.I) and re.search(r'<body\b',text,re.I):
                  text=insert_after(text,r'<head\b[^>]*>',"<?php require_once dirname(__DIR__) . '/head.php'; ?>")
                  text=insert_after(text,r'<body\b[^>]*>',"<?php require_once dirname(__DIR__) . '/header.php'; ?>")
                  text=insert_before(text,r'</body>',"<?php require_once dirname(__DIR__) . '/footer.php'; ?>")
                  text=re.sub(r'<footer[^>]*>\s*<strong>\s*SmartToolz\s*</strong>.*?</footer>','',text,flags=re.I|re.S)
              if text!=original:
                  page.write_text(text,encoding='utf-8')
                  changed.append(str(page))

          tool_pages=[]
          for directory in sorted(p for p in tools_root.iterdir() if p.is_dir()) if tools_root.is_dir() else []:
              slug=directory.name
              if (directory / f'{slug}.php').is_file():
                  tool_pages.append(slug)
          urls=['/','/tool.php','/about.php','/contact.php','/privacy-policy.php','/cookie-policy.php','/terms.php','/disclaimer.php']
          urls += [f'/category/{c}/' for c in ['calculators','design-tools','developer-tools','generators','image-tools','pdf-tools','security','text-tools','utilities']]
          urls += [f'/tools/{s}/' for s in tool_pages]
          urlset=ET.Element('urlset',{'xmlns':'http://www.sitemaps.org/schemas/sitemap/0.9'})
          for url in urls:
              u=ET.SubElement(urlset,'url'); ET.SubElement(u,'loc').text='https://smarttoolz.in'+url
          ET.ElementTree(urlset).write(root/'sitemap.xml',encoding='utf-8',xml_declaration=True)
          print(f'Normalized HTML shells: {len(changed)}')
          print(f'Canonical tool pages: {len(tool_pages)}')

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/tmp/php-lint.txt 2>&1; then
              cat /tmp/php-lint.txt
              failed=1
            fi
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          exit "$failed"

      - name: Canonical shell audit
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          if grep -RIn --exclude-dir=.git --exclude-dir=.github --exclude='*.min.js' '/smart-toolz/tools/' .; then bad=1; fi
          if grep -RIn --include='*.php' 'analytics/tracker.php' tools 2>/dev/null; then bad=1; fi
          if grep -RIn --include='*.php' 'Smart-Tooz' tools 2>/dev/null; then bad=1; fi
          test -f sitemap.xml || bad=1
          php -r 'exit(simplexml_load_file("sitemap.xml") !== false ? 0 : 1);' || bad=1
          exit "$bad"

      - name: Live smoke test
        shell: bash
        run: |
          set -u
          bad=0
          urls=(
            'https://smarttoolz.in/'
            'https://smarttoolz.in/tool.php'
            'https://smarttoolz.in/tools/image-compressor/'
            'https://smarttoolz.in/tools/image-resizer/'
            'https://smarttoolz.in/tools/image-background-remover/'
            'https://smarttoolz.in/tools/json-formatter/'
            'https://smarttoolz.in/tools/age-calculator/'
            'https://smarttoolz.in/tools/color-picker/'
          )
          for url in "${urls[@]}"; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
            printf '%s %s\n' "$code" "$url"
            case "$code" in 2*|3*) ;; *) bad=1 ;; esac
          done
          exit "$bad"

      - name: Commit automation fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/smarttoolz.css assets/less/smarttoolz.less tools head.php header.php sitemap.xml
          if git diff --cached --quiet; then
            echo 'No automation changes required.'
            exit 0
          fi
          git commit -m 'Build SmartToolz styles and normalize site shells [skip-site-automation]'
          git push
