name: SmartToolz Site Automation

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  maintain:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-site-automation]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Normalize tool pages and generate sitemap
        shell: python
        run: |
          from pathlib import Path
          import re
          from xml.etree import ElementTree as ET

          root = Path('.')
          tools_root = root / 'tools'

          def ensure_header(text: str) -> str:
              if "dirname(__DIR__) . '/header.php'" in text or "../header.php" in text or ('require_once dirname(__DIR__)' in text and 'header.php' in text):
                  return text
              include = "<?php require_once dirname(__DIR__) . '/header.php'; ?>\n"
              if text.startswith('<?php'):
                  end = text.find('?>')
                  if end != -1:
                      return text[:end + 2] + '\n' + include + text[end + 2:]
              return include + text

          def ensure_footer(text: str) -> str:
              if "dirname(__DIR__) . '/footer.php'" in text or "../footer.php" in text or ('require_once dirname(__DIR__)' in text and 'footer.php' in text):
                  return text
              footer = "\n<?php require_once dirname(__DIR__) . '/footer.php'; ?>\n"
              if re.search(r'</body>', text, re.I):
                  return re.sub(r'</body>', footer + '</body>', text, count=1, flags=re.I)
              return text.rstrip() + footer

          tool_pages = []
          if tools_root.is_dir():
              for directory in sorted(p for p in tools_root.iterdir() if p.is_dir()):
                  slug = directory.name
                  page = directory / f'{slug}.php'
                  if not page.is_file():
                      continue

                  tool_pages.append(slug)
                  text = page.read_text(encoding='utf-8')
                  original = text

                  text = re.sub(r'^.*analytics/tracker\.php.*(?:\r?\n|$)', '', text, flags=re.I | re.M)
                  text = text.replace('/smart-toolz/tools/', '/tools/')
                  text = text.replace('/smart-toolz/tool.php', '/tool.php')

                  is_html_page = bool(re.search(r'<!doctype\s+html|<html\b', text, flags=re.I))
                  if is_html_page:
                      text = ensure_header(text)
                      text = ensure_footer(text)

                  if text != original:
                      page.write_text(text, encoding='utf-8')

          static_urls = [
              '/', '/tool.php', '/about.php', '/contact.php', '/privacy-policy.php',
              '/cookie-policy.php', '/terms.php', '/disclaimer.php'
          ]
          categories = [
              'calculators', 'design-tools', 'developer-tools', 'generators',
              'image-tools', 'pdf-tools', 'security', 'text-tools', 'utilities'
          ]
          urls = static_urls + [f'/category/{c}/' for c in categories]
          urls += [f'/tools/{slug}/' for slug in tool_pages]

          urlset = ET.Element('urlset', {'xmlns': 'http://www.sitemaps.org/schemas/sitemap/0.9'})
          for url in urls:
              u = ET.SubElement(urlset, 'url')
              ET.SubElement(u, 'loc').text = 'https://smarttoolz.in' + url
          ET.ElementTree(urlset).write(root / 'sitemap.xml', encoding='utf-8', xml_declaration=True)
          print(f'Canonical tool pages discovered: {len(tool_pages)}')

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/tmp/php-lint.txt 2>&1; then
              cat /tmp/php-lint.txt
              failed=1
            fi
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          exit "$failed"

      - name: Legacy and broken-reference audit
        shell: bash
        run: |
          set -euo pipefail
          bad=0

          if grep -RIn --exclude-dir=.git --exclude-dir=.github --exclude='*.min.js' '/smart-toolz/tools/' .; then
            echo 'Found retired /smart-toolz/tools/ references.'
            bad=1
          fi

          if grep -RIn --include='*.php' 'analytics/tracker.php' tools 2>/dev/null; then
            echo 'Found retired tracking references in tool source.'
            bad=1
          fi

          test -f sitemap.xml || { echo 'sitemap.xml missing'; bad=1; }
          php -r 'exit(simplexml_load_file("sitemap.xml") !== false ? 0 : 1);' || { echo 'Invalid sitemap XML'; bad=1; }
          exit "$bad"

      - name: Live smoke test
        shell: bash
        run: |
          set -u
          bad=0
          urls=(
            'https://smarttoolz.in/'
            'https://smarttoolz.in/tool.php'
            'https://smarttoolz.in/tools/image-compressor/'
            'https://smarttoolz.in/tools/image-resizer/'
            'https://smarttoolz.in/tools/image-background-remover/'
            'https://smarttoolz.in/tools/json-formatter/'
          )
          for url in "${urls[@]}"; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
            printf '%s %s\n' "$code" "$url"
            case "$code" in
              2*|3*) ;;
              *) bad=1 ;;
            esac
          done
          exit "$bad"

      - name: Commit automation fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools header.php footer.php sitemap.xml
          if git diff --cached --quiet; then
            echo 'No automation changes required.'
            exit 0
          fi
          git commit -m 'Automate SmartToolz site maintenance [skip-site-automation]'
          git push
