name: Bulk SEO Tool Cleanup

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/bulk-seo.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[skip-bulk-seo]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize remaining tool pages
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          skip = {
              'image-compressor', 'image-resizer', 'image-background-remover',
              'jpg-to-png', 'png-to-jpg', 'word-counter', 'case-converter',
              'qr-generator', 'password-generator'
          }

          for path in sorted((root / 'tools').glob('*/*.php')):
              slug = path.parent.name
              if slug in skip or path.name != f'{slug}.php':
                  continue

              text = path.read_text(encoding='utf-8')
              original = text

              # Remove legacy tracking/database bootstraps from the PHP preamble.
              text = re.sub(r"^.*require_once\\s+\\$_SERVER\['DOCUMENT_ROOT'\].*?/analytics/tracker\\.php';?\\s*\\n?", '', text, flags=re.M)
              text = re.sub(r"^.*require_once\\s+\\$_SERVER\['DOCUMENT_ROOT'\].*?/creator-ai/auth/config\\.php';?\\s*\\n?", '', text, flags=re.M)
              text = re.sub(r"^.*\\$pdo\\s*=\\s*db\(\);.*\\n?", '', text, flags=re.M)
              text = re.sub(r"\\n?\\$smartToozAds\\s*=\\s*\[\];.*?(?=\\?>|<!doctype|<\\!DOCTYPE|<html)", '\n', text, flags=re.S|re.I)
              text = re.sub(r"function\\s+smartToozAd\\s*\\([^)]*\\)\\s*\\{.*?^\\}\\s*", '', text, flags=re.S|re.M)
              text = re.sub(r"^\\s*smartToozAd\([^;]+\);\\s*\\n?", '', text, flags=re.M)

              # Fix legacy absolute tool links.
              text = text.replace('/smart-toolz/tools/', '/tools/')
              text = text.replace('/smart-toolz/tool.php', '/tool.php')

              # Ensure the root shared header is referenced at least once.
              if 'header.php' not in text:
                  marker = text.find('?>')
                  include = "<?php require_once dirname(__DIR__) . '/header.php'; ?>\n"
                  if marker >= 0:
                      text = text[:marker+2] + '\n' + include + text[marker+2:]
                  else:
                      text = include + text

              # Ensure every tool has the shared footer include.
              if 'footer.php' not in text:
                  footer = "\n<?php require_once dirname(__DIR__) . '/footer.php'; ?>\n"
                  if re.search(r'</body>', text, flags=re.I):
                      text = re.sub(r'</body>', footer + '</body>', text, count=1, flags=re.I)
                  else:
                      text += footer

              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Make the shared header/footer idempotent so legacy duplicate includes are harmless.
          hp = root / 'header.php'
          h = hp.read_text(encoding='utf-8')
          guard = "<?php\nif (defined('SMARTTOOLZ_HEADER_LOADED')) { return; }\ndefine('SMARTTOOLZ_HEADER_LOADED', true);\n"
          if "SMARTTOOLZ_HEADER_LOADED" not in h:
              if h.startswith('<?php'):
                  h = guard + h[len('<?php'):]
              else:
                  h = guard + '?>\n' + h
              hp.write_text(h, encoding='utf-8')

          fp = root / 'footer.php'
          f = fp.read_text(encoding='utf-8')
          fguard = "<?php\nif (defined('SMARTTOOLZ_FOOTER_LOADED')) { return; }\ndefine('SMARTTOOLZ_FOOTER_LOADED', true);\n?>\n"
          if "SMARTTOOLZ_FOOTER_LOADED" not in f:
              fp.write_text(fguard + f, encoding='utf-8')

      - name: Commit normalized pages
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools header.php footer.php
          if git diff --cached --quiet; then
            echo 'No bulk changes required.'
            exit 0
          fi
          git commit -m 'Normalize remaining tool pages for SEO and AdSense [skip-bulk-seo]'
          git push
