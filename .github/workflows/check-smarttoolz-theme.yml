name: Check SmartToolz Theme
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint every bundled theme PHP file
        shell: bash
        run: |
          set -euo pipefail
          root="wordpress/wp-content/plugins/smarttoolz-video/theme-src"
          test -d "$root"
          find "$root" -type f -name '*.php' -print0 |
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null || { echo "PHP syntax error: $file"; exit 1; }
          done
          echo 'All bundled theme PHP files passed syntax validation.'
