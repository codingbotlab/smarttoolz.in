name: Credit reference scan

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  scan:
    if: github.event.head_commit.message != 'chore: credit reference scan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan source
        run: |
          set +e
          grep -RniE --exclude-dir=.git --exclude='cleanup-credit-ui.yml' --include='*.php' --include='*.js' --include='*.html' --include='*.css' 'credit' . > credit-scan-report.txt
          status=$?
          if [ "$status" -eq 1 ]; then
            echo 'No credit references found.' > credit-scan-report.txt
          fi
          echo '--- scan ---'
          cat credit-scan-report.txt

      - name: Commit report
        run: |
          git config user.name "smarttoolz-scan"
          git config user.email "actions@users.noreply.github.com"
          git add credit-scan-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: credit reference scan"
          git push
