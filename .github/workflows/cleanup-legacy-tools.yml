name: Cleanup Legacy Tool Code

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-tool-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Remove legacy tool integrations
        shell: python
        run: |
          from pathlib import Path
          import re

          tools_root = Path('tools')
          legacy_markers = re.compile(r'creator-ai/auth/config\.php|analytics/tracker\.php|ads_settings|smartTooz|Smart-Tooz|Smart Tooz', re.I)
          ad_call = re.compile(r'\bsmartTooz(?:Ad|MemeAd)\s*\(', re.I)

          changed=[]
          for page in sorted(tools_root.rglob('*.php')) if tools_root.is_dir() else []:
              if page.name in {'header.php','footer.php','bootstrap.php','tool-sidebar.php','head.php'}:
                  continue
              text=page.read_text(encoding='utf-8')
              original=text

              first=re.match(r'\s*<\?php.*?\?>', text, flags=re.I|re.S)
              if first and legacy_markers.search(first.group(0)):
                  # Legacy tool files kept only presentation/tool logic in HTML/JS; their opening PHP
                  # block was predominantly database, ads and tracker bootstrap. Replace that block
                  # with harmless browser-only compatibility functions so tool logic stays available.
                  calls=ad_call.findall(text)
                  replacement="<?php\ndeclare(strict_types=1);\n"
                  if calls:
                      replacement += "function smartToolzAd(string $key): void {}\nfunction smartToolzMemeAd(string $key): void {}\n"
                  replacement += "?>"
                  text=text[:first.start()]+replacement+text[first.end():]

              text=text.replace('Smart-Tooz','SmartToolz').replace('Smart Tooz','SmartToolz')
              text=text.replace('smartToozAd','smartToolzAd').replace('smartToozMemeAd','smartToolzMemeAd')
              text=re.sub(r'/tools/([a-z0-9-]+)\.php(?=["\'?#\s>])',r'/tools/\1/',text,flags=re.I)
              text=re.sub(r'<footer[^>]*>\s*<strong>\s*SmartToolz\s*</strong>.*?</footer>','',text,flags=re.I|re.S)

              if text!=original:
                  page.write_text(text,encoding='utf-8')
                  changed.append(str(page))
          print(f'Legacy cleanup changed {len(changed)} tool pages')
          for path in changed:
              print(path)

      - name: Audit all canonical tool pages
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          pages=0
          while IFS= read -r -d '' file; do
            pages=$((pages+1))
            if grep -Eqi 'Smart-Tooz|smartTooz|Smart Tooz' "$file"; then
              echo "Legacy branding found: $file"
              failed=1
            fi
            if grep -Eqi "/tools/[A-Za-z0-9-]+\.php(\"|\?|#|[[:space:]]|>|$)" "$file"; then
              echo "Legacy .php tool link found: $file"
              failed=1
            fi
            if grep -Eqi 'creator-ai/auth/config\.php|analytics/tracker\.php|ads_settings' "$file"; then
              echo "Legacy application integration found: $file"
              failed=1
            fi
            if ! php -l "$file" >/tmp/php-lint.txt 2>&1; then
              cat /tmp/php-lint.txt
              failed=1
            fi
          done < <(find tools -mindepth 2 -maxdepth 2 -type f -name '*.php' ! -name 'header.php' ! -name 'footer.php' ! -name 'bootstrap.php' ! -name 'tool-sidebar.php' ! -name 'head.php' -print0)
          echo "Canonical tool files audited: $pages"
          exit "$failed"

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools
          if git diff --cached --quiet; then
            echo 'No legacy cleanup changes required.'
            exit 0
          fi
          git commit -m 'Remove legacy integrations from tool pages [skip-tool-cleanup]'
          git push
