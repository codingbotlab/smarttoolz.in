name: Cleanup legacy tool feedback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: Checkout
        shell: powershell
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Remove legacy feedback UI from every tool page
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'smart-toolz/tools'
          $changed = New-Object System.Collections.Generic.List[string]

          $htmlPattern = '(?is)<div\s+class=["'']tool-support-actions["''][^>]*>.*?</div>\s*'
          $cssPatterns = @(
            '(?is)\.tool-support-actions\s*\{[^{}]*\}\s*',
            '(?is)\.tool-support-card(?:\.report|\.request)?(?:\s*,\s*\.tool-support-card(?:\.report|\.request)?)*\s*\{[^{}]*\}\s*',
            '(?is)\.support-icon\s*\{[^{}]*\}\s*',
            '(?is)\.tool-support-card\s+strong\s*\{[^{}]*\}\s*',
            '(?is)\.tool-support-card\s+small\s*\{[^{}]*\}\s*',
            '(?is)\.tool-support-card\s+\.arrow\s*\{[^{}]*\}\s*'
          )

          Get-ChildItem -LiteralPath $root -Filter '*.php' -File | ForEach-Object {
            if ($_.Name -in @('feedback-remove.php','tool-shell.php','tool-sidebar.php')) { return }
            $text = [System.IO.File]::ReadAllText($_.FullName)
            $original = $text
            $text = [regex]::Replace($text, $htmlPattern, '')
            foreach ($pattern in $cssPatterns) { $text = [regex]::Replace($text, $pattern, '') }
            if ($text -ne $original) {
              [System.IO.File]::WriteAllText($_.FullName, $text, [System.Text.UTF8Encoding]::new($false))
              $changed.Add($_.FullName)
            }
          }

          Write-Host "Cleaned $($changed.Count) tool files"
          $changed | ForEach-Object { Write-Host $_ }

      - name: Commit and push
        shell: powershell
        run: |
          git config user.name 'smarttoolz-cleanup-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-toolz/tools
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Nothing to commit.'; exit 0 }
          git commit -m 'Remove legacy tool feedback from tool pages'
          git push origin HEAD:main
