name: Cleanup legacy tool feedback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy feedback UI from every tool page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('smart-toolz/tools')
          changed = []

          html_block = re.compile(
              r'<div\s+class=["\']tool-support-actions["\'][^>]*>.*?</div>\s*',
              re.I | re.S,
          )

          support_css = re.compile(
              r'\.tool-support-actions\s*\{[^{}]*\}\s*',
              re.I | re.S,
          )
          card_css = re.compile(
              r'\.tool-support-card(?:\.report|\.request)?(?:\s*,\s*\.tool-support-card(?:\.report|\.request)?)*\s*\{[^{}]*\}\s*',
              re.I | re.S,
          )

          for path in sorted(root.glob('*.php')):
              if path.name in {'feedback-remove.php', 'tool-shell.php', 'tool-sidebar.php'}:
                  continue
              text = path.read_text(encoding='utf-8-sig')
              original = text

              text = html_block.sub('', text)
              text = support_css.sub('', text)
              text = card_css.sub('', text)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Cleaned {len(changed)} tool files')
          for item in changed:
              print(item)
          PY

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet -- smart-toolz/tools; then
            echo 'No legacy feedback markup found in tool files.'
            exit 0
          fi
          git config user.name 'smarttoolz-cleanup-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-toolz/tools
          git commit -m 'Remove legacy tool feedback from tool pages'
          git push
