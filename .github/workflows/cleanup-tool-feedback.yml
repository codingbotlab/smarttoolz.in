name: Cleanup legacy tool feedback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy feedback UI everywhere
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('smart-toolz/tools')
          changed = []

          html_pattern = re.compile(r'<div\s+class=["\']tool-support-actions["\'][^>]*>.*?</div>\s*', re.I | re.S)
          css_patterns = [
              re.compile(r'\.tool-support-actions\s*\{[^{}]*\}\s*', re.I | re.S),
              re.compile(r'\.tool-support-card(?:\.report|\.request)?(?:\s*,\s*\.tool-support-card(?:\.report|\.request)?)*\s*\{[^{}]*\}\s*', re.I | re.S),
              re.compile(r'\.support-icon\s*\{[^{}]*\}\s*', re.I | re.S),
              re.compile(r'\.tool-support-card\s+strong\s*\{[^{}]*\}\s*', re.I | re.S),
              re.compile(r'\.tool-support-card\s+small\s*\{[^{}]*\}\s*', re.I | re.S),
              re.compile(r'\.tool-support-card\s+\.arrow\s*\{[^{}]*\}\s*', re.I | re.S),
          ]

          for path in sorted(root.glob('*.php')):
              if path.name in {'feedback-remove.php','tool-shell.php','tool-sidebar.php'}:
                  continue
              text = path.read_text(encoding='utf-8-sig')
              original = text
              text = html_pattern.sub('', text)
              for pattern in css_patterns:
                  text = pattern.sub('', text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Cleaned {len(changed)} tool files')
          for item in changed:
              print(item)
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'smarttoolz-cleanup-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-toolz/tools
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Remove legacy tool feedback from tool pages'
          git push origin HEAD:main
