name: Finalize SmartToolz theme

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate bundled theme
        shell: bash
        run: |
          set -euo pipefail
          ROOT="wordpress/wp-content/plugins/smarttoolz-video/theme-src"
          test -f "$ROOT/functions.php"
          test -f "$ROOT/style.css"
          test -f "$ROOT/header.php"
          test -f "$ROOT/footer.php"
          find "$ROOT" -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null || { echo "PHP syntax error: $file"; exit 1; }
          done
          if grep -Rni --exclude-dir='.git' -E 'Astra_Menu|astra_is_white_labelled|ASTRA_THEME_DIR|ASTRA_THEME_URI|Astra_Ext_Extension' "$ROOT"; then
            echo 'Retired runtime identifiers remain.'
            exit 1
          fi
          echo 'Bundled SmartToolz Video theme passed validation.'
