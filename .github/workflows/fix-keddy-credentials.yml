name: Fix Keddy Credentials

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-credentials:
    if: ${{ !contains(github.event.head_commit.message, '[keddy-credentials-fixed]') }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Keddy use the current client ID and saved secret
        shell: pwsh
        run: |
          $f = 'keddy-bot/bot.php'
          if (-not (Test-Path $f)) { throw "Missing $f" }
          $c = Get-Content -Raw -LiteralPath $f
          $old = "`$id=trim((string)(getenv('KEDDY_GOOGLE_CLIENT_ID')?:(`$c['google_client_id']??KEDDY_GOOGLE_CLIENT_ID)));`$secret=trim((string)(getenv('KEDDY_GOOGLE_CLIENT_SECRET')?:(`$c['google_client_secret']??'')));`$redirect=trim((string)(getenv('KEDDY_REDIRECT_URI')?:(`$c['redirect_uri']??KEDDY_REDIRECT_URI)));"
          $new = "`$id=KEDDY_GOOGLE_CLIENT_ID;`$secret=trim((string)(getenv('KEDDY_GOOGLE_CLIENT_SECRET')?:(`$c['google_client_secret']??'')));`$redirect=KEDDY_REDIRECT_URI;"
          if ($c.Contains($old)) {
            $c = $c.Replace($old,$new)
          }
          Set-Content -LiteralPath $f -Value $c -NoNewline -Encoding utf8
      - name: Validate PHP files
        shell: pwsh
        run: |
          php -v
          php -l keddy-bot/bot.php
          php -l keddy-bot/oauth.php
          php -l keddy-bot/oauth-callback.php
          php -l keddy-bot/setup.php
      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add keddy-bot/bot.php
          if (git diff --cached --quiet) {
            Write-Host 'No Keddy credential changes needed.'
            exit 0
          }
          git commit -m 'Fix Keddy credential selection [keddy-credentials-fixed]'
          git push
