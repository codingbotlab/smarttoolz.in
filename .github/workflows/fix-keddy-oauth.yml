name: Fix Keddy OAuth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-keddy:
    if: ${{ !contains(github.event.head_commit.message, '[keddy-fixed]') }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Keddy client ID
        shell: pwsh
        run: |
          $files = @('keddy-bot/bot.php','keddy-bot/setup.php')
          $old1 = '523738407628-o1c4t43j4vjriajnvojpt4cio4mktr01.apps.googleusercontent.com'
          $new1 = '523738407628-svvuj66f6836mvbb6438sgl1gpu1pntc.apps.googleusercontent.com'
          foreach ($f in $files) {
            if (Test-Path $f) {
              $c = Get-Content -Raw -LiteralPath $f
              $c = $c.Replace($old1,$new1)
              Set-Content -LiteralPath $f -Value $c -NoNewline -Encoding utf8
            }
          }
      - name: Commit Keddy fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add keddy-bot/bot.php keddy-bot/setup.php
          if (git diff --cached --quiet) {
            Write-Host 'Keddy OAuth files already use the current client.'
            exit 0
          }
          git commit -m 'Fix Keddy OAuth client ID [keddy-fixed]'
          git push
