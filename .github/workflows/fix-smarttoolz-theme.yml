name: Fix SmartToolz Theme
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove upstream theme runtime leftovers
        shell: bash
        run: |
          set -euo pipefail
          ROOT="wordpress/wp-content/themes/smarttoolz-theme"
          test -d "$ROOT"
          find "$ROOT" -type f \( -name '*.php' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.xml' -o -name '*.html' -o -name '*.txt' -o -name '*.md' \) -print0 | while IFS= read -r -d '' f; do
            file -b --mime "$f" | grep -qi 'text' || continue
            python3 - "$f" <<'PY'
from pathlib import Path
import re, sys
p = Path(sys.argv[1])
s = p.read_text(errors='ignore')
repls = [
    (r'\bAstra_Ext_Extension\b', 'SmartToolz_Ext_Extension'),
    (r'\bAstra_Menu\b', 'SmartToolz_Menu'),
    (r'\bAstra_Admin_Loader\b', 'SmartToolz_Admin_Loader'),
    (r'\bAstra_Global_Palette\b', 'SmartToolz_Global_Palette'),
    (r'\bAstra_Dynamic_CSS\b', 'SmartToolz_Dynamic_CSS'),
    (r'\bAstra_Theme_Options\b', 'SmartToolz_Theme_Options'),
    (r'\bastra_is_white_labelled\b', 'smarttoolz_is_white_labelled'),
    (r'\bASTRA_EXT_VER\b', 'SMARTTOOLZ_EXT_VER'),
    (r'\bASTRA_THEME_ORG_VERSION\b', 'SMARTTOOLZ_THEME_ORG_VERSION'),
    (r'\bASTRA_THEME_DIR\b', 'SMARTTOOLZ_THEME_DIR'),
    (r'\bASTRA_THEME_URI\b', 'SMARTTOOLZ_THEME_URI'),
    (r'\bastra_admin_settings\b', 'smarttoolz_admin_settings'),
]
for pat, rep in repls:
    s = re.sub(pat, rep, s)
p.write_text(s)
PY
          done
          python3 - "$ROOT/admin/includes/class-smarttoolz-menu.php" <<'PY'
from pathlib import Path
import sys
p = Path(sys.argv[1])
s = p.read_text()
s = s.replace("if ( ! smarttoolz_is_white_labelled() )", "if ( ! smarttoolz_is_white_labelled() )")
if 'function smarttoolz_is_white_labelled()' not in s:
    marker = "if ( ! defined( 'ABSPATH' ) ) {"
    helper = "if ( ! function_exists( 'smarttoolz_is_white_labelled' ) ) {\n\tfunction smarttoolz_is_white_labelled() {\n\t\treturn false;\n\t}\n}\n\n"
    s = s.replace(marker, helper + marker, 1)
p.write_text(s)
PY
          if [ -f "$ROOT/style.css" ]; then
            sed -i \
              -e 's/^Theme Name:.*/Theme Name: SmartToolz Theme/' \
              -e 's#^Theme URI:.*#Theme URI: https://smarttoolz.in/#' \
              -e 's/^Author:.*/Author: SmartToolz/' \
              -e 's#^Author URI:.*#Author URI: https://smarttoolz.in/#' \
              "$ROOT/style.css"
          fi
          # No executable source should retain these broken runtime identifiers.
          ! grep -Rni --exclude-dir='.git' -E 'astra_is_white_labelled|ASTRA_EXT_VER|ASTRA_THEME_DIR|ASTRA_THEME_URI' "$ROOT"
          php_errors=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || php_errors=1
          done < <(find "$ROOT" -type f -name '*.php' -print0)
          test "$php_errors" -eq 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes needed.'
            exit 0
          fi
          git commit -m 'Fix remaining SmartToolz theme runtime references'
          git push origin HEAD:main
