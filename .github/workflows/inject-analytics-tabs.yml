name: Inject Analytics Tabs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[analytics-tabs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject tabs assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('analytics/index.php')
          s=p.read_text(encoding='utf-8-sig')
          css='<link rel="stylesheet" href="/analytics/tabs.css?v=20260901-1">'
          js='<script src="/analytics/tabs.js?v=20260901-1"></script>'
          if css not in s and '</head>' in s:
              s=s.replace('</head>', css+'\n</head>',1)
          if js not in s and '</body>' in s:
              s=s.replace('</body>', js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/index.php analytics/tabs.css analytics/tabs.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add analytics tabs [analytics-tabs]"
          git push
