name: Install Admin GA Style Analytics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[admin-ga-analytics]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install analytics panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('smart-toolz/admin/index.php')
          s=p.read_text(encoding='utf-8')
          start="<?php elseif($tab==='analytics'): ?>"
          end="<?php elseif($tab==='ads'): ?>"
          a=s.find(start); b=s.find(end,a)
          if a<0 or b<0 or b<=a:
              raise SystemExit('Analytics markers not found')
          repl=start+"\n<?php require __DIR__ . '/analytics-panel.php'; ?>\n"
          s=s[:a]+repl+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-toolz/admin/index.php smart-toolz/admin/analytics-panel.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install GA-style admin analytics [admin-ga-analytics]"
          git push
