name: Install WordPress Core

on:
  workflow_dispatch:
  push:
    paths:
      - 'wordpress/.wordpress-renew'

permissions:
  contents: write

jobs:
  install-wordpress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest WordPress
        run: |
          set -e
          curl -fL https://wordpress.org/latest.tar.gz -o /tmp/wordpress.tar.gz
          rm -rf /tmp/wordpress
          tar -xzf /tmp/wordpress.tar.gz -C /tmp

      - name: Renew WordPress core and remove custom extensions
        run: |
          set -e
          rm -rf wordpress/wp-admin wordpress/wp-includes
          find wordpress -maxdepth 1 -type f ! -name 'wp-config.php' ! -name '.wordpress-renew' -delete
          rsync -a /tmp/wordpress/ wordpress/ --exclude='wp-content/' --exclude='wp-config.php'
          rm -rf wordpress/wp-content/plugins/* wordpress/wp-content/themes/* wordpress/wp-content/mu-plugins
          mkdir -p wordpress/wp-content/plugins wordpress/wp-content/themes
          printf '%s\n' 'WordPress core renewed from wordpress.org; custom themes/plugins/MU-plugins removed.' > wordpress/.wordpress-cleanup-note
          rm -f wordpress/.wordpress-renew
          test -f wordpress/wp-settings.php
          test -f wordpress/wp-login.php
          test -d wordpress/wp-admin
          test -d wordpress/wp-includes

      - name: Commit renewed WordPress
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A wordpress
          git rm -f --cached wordpress/.wordpress-cleanup-note >/dev/null 2>&1 || true
          rm -f wordpress/.wordpress-cleanup-note
          git add -A wordpress
          if git diff --cached --quiet; then
            echo 'WordPress core already matches the renewal state.'
            exit 0
          fi
          git commit -m 'Renew WordPress core and remove custom theme plugins'
          git push
