name: Link global fonts to favicon tools

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/link-global-fonts-both.yml'

permissions:
  contents: write

jobs:
  link-fonts:
    if: ${{ !contains(github.event.head_commit.message, '[font-link-done]') }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Add global font script to both favicon tools
        shell: pwsh
        run: |
          $files = @(
            'smart-toolz/tools/favicon-generator.php',
            'smart-toolz/tools/favicon-ico-generator.php'
          )
          $tag = '<script src="/smart-toolz/assets/global-fonts.js" defer></script>'
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing $file" }
            $s = Get-Content $file -Raw -Encoding UTF8
            if ($s -notmatch [regex]::Escape($tag)) {
              $s = $s -replace '(<meta name="robots"[^>]*>)', '$1' + "`n" + $tag
              Set-Content $file $s -Encoding UTF8 -NoNewline
            }
          }
      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-toolz/tools/favicon-generator.php smart-toolz/tools/favicon-ico-generator.php
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Link global fonts to both favicon tools [font-link-done]'
            git push
          }
      - name: Remove one-time workflow
        if: success()
        shell: pwsh
        run: |
          git rm .github/workflows/link-global-fonts-both.yml
          git commit -m 'Remove one-time favicon font linker [font-link-done]'
          git push
