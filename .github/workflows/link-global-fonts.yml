name: Link global fonts

on:
  push:
    paths:
      - '.github/workflows/link-global-fonts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link:
    if: ${{ !contains(github.event.head_commit.message, '[global-fonts-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link global font list in SmartToolz header
        shell: python
        run: |
          from pathlib import Path
          p = Path('smart-toolz/header.php')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/smart-toolz/assets/global-fonts.js" defer></script>'
          if tag not in s:
              marker = '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">'
              if marker not in s:
                  raise SystemExit('Header font marker not found')
              s = s.replace(marker, marker + tag, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-toolz/header.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Link global fonts [global-fonts-done]"
          git push
      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/link-global-fonts.yml || true
          git commit -m "Remove one-time font linker [global-fonts-done]" || true
          git push || true
