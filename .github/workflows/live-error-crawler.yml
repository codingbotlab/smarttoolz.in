name: SmartToolz Live Error Crawler

# Automatic monitoring now runs on Hostinger cron to avoid GitHub Actions billing.
# Keep this workflow for manual diagnostics only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manual-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run crawler
        continue-on-error: true
        env:
          CRAWLER_BASE_URL: https://smarttoolz.in/smart-toolz/
          CRAWLER_MAX_PAGES: 40
          CRAWLER_TIMEOUT_MS: 15000
        run: node monitor/live-error-crawler.mjs
