name: Normalize SmartToolz Tool Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-tool-normalization]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize every canonical tool page
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          tools_root = root / 'tools'

          def strip_root_header(text: str) -> str:
              patterns = [
                  r'\s*<\?php\s*require_once dirname\(__DIR__\) \. [\'\"]\/header\.php[\'\"]\s*;?\s*\?>',
                  r'\s*<\?php\s*require dirname\(__DIR__\) \. [\'\"]\/header\.php[\'\"]\s*;?\s*\?>',
              ]
              for pattern in patterns:
                  text = re.sub(pattern, '\n', text, flags=re.I)
              return text

          def strip_root_footer(text: str) -> str:
              # Remove only the small legacy footer blocks that duplicate the shared footer.
              text = re.sub(
                  r'<footer[^>]*>\s*<strong>\s*(?:Smart-Tooz|SmartToolz)\s*</strong>.*?</footer>',
                  '', text, flags=re.I | re.S
              )
              return text

          def strip_legacy_shim_includes(text: str) -> str:
              text = re.sub(r'<\?php\s*require_once __DIR__\s*\.\s*[\'\"]\/tool-sidebar\.php[\'\"]\s*;?\s*\?>', '', text, flags=re.I)
              text = re.sub(r'<\?php\s*require __DIR__\s*\.\s*[\'\"]\/tool-sidebar\.php[\'\"]\s*;?\s*\?>', '', text, flags=re.I)
              return text

          def ensure_shared_header(text: str) -> str:
              if '<body' not in text.lower():
                  return text
              include = "\n<?php require_once dirname(__DIR__) . '/header.php'; ?>\n"
              if "dirname(__DIR__) . '/header.php'" in text:
                  return text
              return re.sub(r'(<body\b[^>]*>)', r'\1' + include, text, count=1, flags=re.I)

          def ensure_shared_footer(text: str) -> str:
              if '</body>' not in text.lower():
                  return text
              include = "\n<?php require_once dirname(__DIR__) . '/footer.php'; ?>\n"
              if "dirname(__DIR__) . '/footer.php'" in text:
                  return text
              return re.sub(r'</body>', include + '</body>', text, count=1, flags=re.I)

          changed = []
          for directory in sorted(p for p in tools_root.iterdir() if p.is_dir()) if tools_root.is_dir() else []:
              slug = directory.name
              page = directory / f'{slug}.php'
              if not page.is_file():
                  continue

              text = page.read_text(encoding='utf-8')
              original = text

              text = strip_root_header(text)
              text = strip_root_footer(text)
              text = strip_legacy_shim_includes(text)
              text = text.replace('Smart-Tooz', 'SmartToolz').replace('Smart Tooz', 'SmartToolz')
              text = text.replace('/smart-toolz/tools/', '/tools/')
              text = text.replace('/smart-toolz/tool.php', '/tool.php')
              text = text.replace('smarttooz', 'smarttoolz').replace('smartTooz', 'smartToolz')

              is_html = bool(re.search(r'<!doctype\s+html|<html\b', text, re.I))
              if is_html:
                  text = ensure_shared_header(text)
                  text = ensure_shared_footer(text)

              if text != original:
                  page.write_text(text, encoding='utf-8')
                  changed.append(str(page))

          print(f'Normalized {len(changed)} tool pages')
          for path in changed:
              print(path)

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/tmp/php-lint.txt 2>&1; then
              cat /tmp/php-lint.txt
              failed=1
            fi
          done < <(find tools -type f -name '*.php' -print0)
          exit "$failed"

      - name: Verify canonical structure
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          pages=0
          for file in tools/*/*.php; do
            [ -f "$file" ] || continue
            case "$file" in
              tools/header.php|tools/footer.php|tools/bootstrap.php|tools/tool-sidebar.php) continue ;;
            esac
            pages=$((pages+1))
            if grep -qi 'Smart-Tooz' "$file"; then
              echo "Legacy brand found: $file"
              failed=1
            fi
            if grep -qi '/smart-toolz/tools/' "$file"; then
              echo "Legacy tool URL found: $file"
              failed=1
            fi
          done
          echo "Canonical tool page files checked: $pages"
          exit "$failed"

      - name: Commit normalization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools
          if git diff --cached --quiet; then
            echo 'No tool normalization changes required.'
            exit 0
          fi
          git commit -m 'Normalize all SmartToolz tool pages [skip-tool-normalization]'
          git push
