name: Normalize SmartToolz Tool Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-tool-normalization]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize all canonical tool pages
        shell: python
        run: |
          from pathlib import Path
          import re

          tools_root = Path('tools')
          skip = {'header.php', 'footer.php', 'bootstrap.php', 'tool-sidebar.php'}

          def remove_include(text: str, filename: str) -> str:
              name = re.escape(filename)
              patterns = [
                  rf'\s*<\?php\s*require_once\s+dirname\(__DIR__\)\s*\.\s*[\"\']/{name}[\"\']\s*;?\s*\?>',
                  rf'\s*<\?php\s*require\s+dirname\(__DIR__\)\s*\.\s*[\"\']/{name}[\"\']\s*;?\s*\?>',
                  rf'\s*<\?php\s*require_once\s+__DIR__\s*\.\s*[\"\']\.\./{name}[\"\']\s*;?\s*\?>',
                  rf'\s*<\?php\s*require\s+__DIR__\s*\.\s*[\"\']\.\./{name}[\"\']\s*;?\s*\?>',
              ]
              for pattern in patterns:
                  text = re.sub(pattern, '\n', text, flags=re.I)
              return text

          def remove_legacy_footer(text: str) -> str:
              return re.sub(
                  r'<footer[^>]*>\s*<strong>\s*(?:Smart-Tooz|SmartToolz)\s*</strong>.*?</footer>',
                  '', text, flags=re.I | re.S
              )

          def normalize_links(text: str) -> str:
              text = re.sub(r'/tools/([a-z0-9-]+)\.php(?=[\"\'?#\s>])', r'/tools/\1/', text, flags=re.I)
              text = text.replace('/smart-toolz/tools/', '/tools/')
              text = text.replace('/smart-toolz/tool.php', '/tool.php')
              return text

          def ensure_document(text: str, slug: str) -> str:
              text = text.strip()
              has_html = bool(re.search(r'<html\b', text, re.I))
              has_body = bool(re.search(r'<body\b', text, re.I))

              if not has_html:
                  title = re.sub(r'[-_]+', ' ', slug).title()
                  text = (
                      '<!doctype html>\n<html lang="en">\n<head>\n'
                      '<meta charset="utf-8">\n'
                      '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
                      f'<title>{title} | SmartToolz</title>\n'
                      f'<link rel="canonical" href="https://smarttoolz.in/tools/{slug}/">\n'
                      '</head>\n<body>\n' + text + '\n</body>\n</html>'
                  )
              elif not has_body:
                  text = re.sub(r'(</head>)', r'\1\n<body>\n' + text + '\n</body>', text, count=1, flags=re.I)

              return text

          def inject_shell(text: str) -> str:
              header = "<?php require_once dirname(__DIR__) . '/header.php'; ?>"
              footer = "<?php require_once dirname(__DIR__) . '/footer.php'; ?>"
              text = re.sub(r'<body\b([^>]*)>', r'<body\1>\n' + header, text, count=1, flags=re.I)
              text = re.sub(r'</body>', footer + '\n</body>', text, count=1, flags=re.I)
              return text

          changed = []
          pages = 0
          for directory in sorted(p for p in tools_root.iterdir() if p.is_dir()) if tools_root.is_dir() else []:
              slug = directory.name
              page = directory / f'{slug}.php'
              if not page.is_file() or page.name in skip:
                  continue

              pages += 1
              text = page.read_text(encoding='utf-8')
              original = text

              text = remove_include(text, 'header.php')
              text = remove_include(text, 'footer.php')
              text = remove_legacy_footer(text)
              text = normalize_links(text)
              text = text.replace('Smart-Tooz', 'SmartToolz').replace('Smart Tooz', 'SmartToolz')
              text = text.replace('smarttooz', 'smarttoolz').replace('smartTooz', 'smartToolz')
              text = ensure_document(text, slug)

              # Keep exactly one shared shell include in every page.
              text = re.sub(r'<body\b[^>]*>\s*<\?php\s*require_once dirname\(__DIR__\)\s*\.\s*[\"\']/(?:header|footer)\.php[\"\']\s*;?\s*\?>', lambda m: re.sub(r'/(?:header|footer)', '/header', m.group(0)), text, flags=re.I)
              # Remove duplicate shared shell includes created by previous runs.
              text = re.sub(r'(?:\s*<\?php\s*require_once dirname\(__DIR__\)\s*\.\s*[\"\']/header\.php[\"\']\s*;?\s*\?>){2,}', "\n<?php require_once dirname(__DIR__) . '/header.php'; ?>", text, flags=re.I)
              text = re.sub(r'(?:\s*<\?php\s*require_once dirname\(__DIR__\)\s*\.\s*[\"\']/footer\.php[\"\']\s*;?\s*\?>){2,}', "\n<?php require_once dirname(__DIR__) . '/footer.php'; ?>", text, flags=re.I)

              # If an include still exists, place it after <body>; otherwise insert it.
              text = re.sub(r'<body\b([^>]*)>(?!\s*<\?php\s*require_once dirname\(__DIR__\))', r'<body\1>\n<?php require_once dirname(__DIR__) . \'/header.php\'; ?>', text, count=1, flags=re.I)
              if "dirname(__DIR__) . '/footer.php'" not in text:
                  text = re.sub(r'</body>', "<?php require_once dirname(__DIR__) . '/footer.php'; ?>\n</body>", text, count=1, flags=re.I)

              # Strip any remaining legacy root-header include accidentally left outside <body>.
              occurrences = list(re.finditer(r'<\?php\s*require_once dirname\(__DIR__\)\s*\.\s*[\"\']/header\.php[\"\']\s*;?\s*\?>', text, re.I))
              if len(occurrences) > 1:
                  first = occurrences[0]
                  # Keep the first include only when it is immediately inside body.
                  body_pos = text.lower().find('<body')
                  if first.start() < body_pos:
                      text = text[:first.start()] + text[first.end():]

              if text != original:
                  page.write_text(text.strip() + '\n', encoding='utf-8')
                  changed.append(str(page))

          print(f'Canonical tool page files checked: {pages}')
          print(f'Pages changed: {len(changed)}')
          for path in changed:
              print(path)

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/tmp/php-lint.txt 2>&1; then
              cat /tmp/php-lint.txt
              failed=1
            fi
          done < <(find tools -type f -name '*.php' -not -path 'tools/bootstrap.php' -print0)
          exit "$failed"

      - name: Audit canonical URLs and branding
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          pages=0
          for file in tools/*/*.php; do
            [ -f "$file" ] || continue
            case "$file" in
              tools/header.php|tools/footer.php|tools/bootstrap.php|tools/tool-sidebar.php) continue ;;
            esac
            pages=$((pages+1))
            if grep -qi 'Smart-Tooz' "$file"; then
              echo "Legacy brand found: $file"
              failed=1
            fi
            if grep -Eqi '/tools/[A-Za-z0-9-]+\.php([\"\'?#[:space:]>]|$)' "$file"; then
              echo "Legacy .php tool URL found: $file"
              failed=1
            fi
          done
          echo "Tool pages audited: $pages"
          exit "$failed"

      - name: Commit normalization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools
          if git diff --cached --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git commit -m 'Normalize all SmartToolz tool page shells [skip-tool-normalization]'
          git push
