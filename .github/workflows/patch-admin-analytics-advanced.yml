name: Patch admin analytics advanced
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch analytics tab
        run: python3 scripts/patch-admin-analytics-advanced.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-toolz/admin/index.php
          git commit -m "Upgrade admin analytics dashboard"
          git push
