name: Theme rebrand
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebrand:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename theme and rebrand source
        shell: bash
        run: |
          set -euo pipefail
          SRC="wordpress/wp-content/themes/astra"
          DST="wordpress/wp-content/themes/smarttoolz-theme"
          if [ ! -d "$SRC" ]; then
            echo "Source theme is already removed. Nothing to do."
            exit 0
          fi
          mv "$SRC" "$DST"
          find "$DST" -depth -name '*astra*' -print0 | while IFS= read -r -d '' p; do
            d="$(dirname "$p")"
            b="$(basename "$p")"
            nb="${b//astra/smarttoolz}"
            nb="${nb//Astra/SmartToolz}"
            [ "$b" = "$nb" ] || mv "$p" "$d/$nb"
          done
          find "$DST" -type f \( \
            -name '*.php' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o \
            -name '*.xml' -o -name '*.html' -o -name '*.htm' -o -name '*.md' -o \
            -name '*.txt' -o -name '*.svg' -o -name '*.scss' -o -name '*.less' \
          \) -print0 | while IFS= read -r -d '' f; do
            sed -i \
              -e 's/Astra/SmartToolz/g' \
              -e 's/astra/smarttoolz/g' \
              -e 's/ASTRA/SMARTTOOLZ/g' \
              "$f"
          done
          if grep -RniE 'astra|Astra|ASTRA' "$DST" --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.gif' --exclude='*.webp' 2>/dev/null; then
            echo 'Rebrand check failed: old brand text remains.'
            exit 1
          fi
          rm -f .github/workflows/rebrand-theme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Create SmartToolz theme from installed theme and remove old branding'
          git push origin HEAD:main
