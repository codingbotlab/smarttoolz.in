name: Theme rebrand
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebrand:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy and rebrand theme
        shell: bash
        run: |
          set -euo pipefail
          SRC="wordpress/wp-content/themes/astra"
          DST="wordpress/wp-content/themes/smarttoolz-theme"

          if [ ! -d "$SRC" ]; then
            echo "Astra source directory not found."
            exit 1
          fi

          rm -rf "$DST"
          cp -a "$SRC" "$DST"

          # Rename paths first so the copied theme has no Astra-named files/directories.
          while IFS= read -r -d '' p; do
            d="$(dirname "$p")"
            b="$(basename "$p")"
            nb="${b//Astra/SmartToolz}"
            nb="${nb//astra/smarttoolz}"
            if [ "$b" != "$nb" ]; then
              mv "$p" "$d/$nb"
            fi
          done < <(find "$DST" -depth -name '*[Aa]stra*' -print0)

          # Replace the old theme identifier/brand throughout text source files.
          find "$DST" -type f -print0 | while IFS= read -r -d '' f; do
            case "$f" in
              *.php|*.css|*.scss|*.less|*.js|*.json|*.xml|*.html|*.htm|*.md|*.txt|*.svg|*.po|*.pot|*.mo)
                if file -b --mime "$f" | grep -qi 'text'; then
                  sed -i \
                    -e 's/Brainstorm Force/SmartToolz/g' \
                    -e 's/WPAstra/SmartToolz/g' \
                    -e 's/Astra/SmartToolz/g' \
                    -e 's/astra/smarttoolz/g' \
                    -e 's/ASTRA/SMARTTOOLZ/g' \
                    "$f"
                fi
                ;;
            esac
          done

          # Theme metadata must identify SmartToolz, not the upstream theme.
          if [ -f "$DST/style.css" ]; then
            sed -i \
              -e 's/^Theme Name:.*/Theme Name: SmartToolz Theme/' \
              -e 's#^Theme URI:.*#Theme URI: https://smarttoolz.in/#' \
              -e 's/^Author:.*/Author: SmartToolz/' \
              -e 's#^Author URI:.*#Author URI: https://smarttoolz.in/#' \
              -e 's/^Text Domain:.*/Text Domain: smarttoolz-theme/' \
              "$DST/style.css"
          fi

          # Never leave the old directory in the repository.
          rm -rf "$SRC"

          # Hard validation: no old brand/slug may remain in the theme source.
          if grep -RniE --exclude-dir='.git' --exclude='*.map' 'astra|wpastra|brainstorm[[:space:]]+force' "$DST" 2>/dev/null; then
            echo 'Rebrand check failed: old Astra branding remains in SmartToolz theme.'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Create SmartToolz theme from Astra and remove old branding'
          git push origin HEAD:main

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rebrand-theme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rebrand-theme.yml
          git commit -m 'Remove one-time theme rebrand workflow'
          git push origin HEAD:main
