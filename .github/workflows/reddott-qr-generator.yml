name: Reddott QR Generator Video

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reddott-qr-generator.yml'
      - 'Reddott-films/youtube/upload_video.py'
      - 'Reddott-films/knowledge-videos/qr-generator/**'
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write

env:
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

jobs:
  build-publish:
    # Self-hosted Windows runner: no GitHub-hosted Actions minutes are consumed.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify local Python
        shell: pwsh
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python) { throw 'Python 3.11 is required on the self-hosted Windows runner. Install Python.Python.3.11 and restart the runner service.' }
          $version = (& python --version 2>&1).ToString()
          Write-Host "Python detected: $version"
          if ($version -notmatch '^Python 3\.11\.') { throw "Python 3.11 is required. Detected: $version" }

      - name: Verify local tools
        shell: pwsh
        run: |
          node --version
          npm --version
          python --version
          ffmpeg -version
          ffprobe -version

      - name: Install Playwright
        working-directory: Reddott-films/knowledge-videos/qr-generator/recorder
        shell: pwsh
        run: |
          npm install
          npx playwright install chromium

      - name: Install Kokoro TTS
        shell: pwsh
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE 'tts-venv'
          if (-not (Test-Path $venv)) {
            python -m venv $venv
          }
          & (Join-Path $venv 'Scripts/python.exe') -m pip install --upgrade pip
          & (Join-Path $venv 'Scripts/pip.exe') install 'kokoro>=0.9.4' soundfile

      - name: Record the real SmartToolz page
        working-directory: Reddott-films/knowledge-videos/qr-generator/recorder
        shell: pwsh
        run: node record.js

      - name: Verify browser recording is under one minute
        working-directory: Reddott-films/knowledge-videos/qr-generator
        shell: pwsh
        run: |
          if (-not (Test-Path output/browser-demo.webm)) { throw 'browser-demo.webm was not created.' }
          $duration = [double](& ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/browser-demo.webm)
          Write-Host "Browser recording duration: $duration seconds"
          if ($duration -gt 60.25) { throw "Browser recording exceeds 60 seconds: $duration" }

      - name: Build natural narration
        working-directory: Reddott-films/knowledge-videos/qr-generator
        shell: pwsh
        env:
          KOKORO_PYTHON: ${{ github.workspace }}\tts-venv\Scripts\python.exe
          KOKORO_VOICE: af_heart
          KOKORO_SPEED: '1.0'
        run: node build-narration.mjs

      - name: Verify narration is under one minute
        working-directory: Reddott-films/knowledge-videos/qr-generator
        shell: pwsh
        run: |
          if (-not (Test-Path output/narration.wav)) { throw 'narration.wav was not created.' }
          if (-not (Test-Path output/narration-duration.txt)) { throw 'narration-duration.txt was not created.' }
          $duration = [double](Get-Content output/narration-duration.txt)
          Write-Host "Narration duration: $duration seconds"
          if ($duration -gt 60) { throw "Narration exceeds 60 seconds: $duration" }

      - name: Prepare Remotion public assets
        working-directory: Reddott-films/knowledge-videos/qr-generator/remotion
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public, out | Out-Null
          Copy-Item ..\output\browser-demo.webm public\browser-demo.webm -Force
          Copy-Item ..\output\narration.wav public\narration.wav -Force
          Copy-Item ..\output\narration-duration.txt public\narration-duration.txt -Force
          npm install

      - name: Render final MP4
        working-directory: Reddott-films/knowledge-videos/qr-generator/remotion
        shell: pwsh
        run: npx remotion render src/index.jsx QRGenerator out/qr-generator.mp4 --codec=h264 --crf=23 --concurrency=2 --log=verbose

      - name: Verify final MP4 is under one minute
        working-directory: Reddott-films/knowledge-videos/qr-generator
        shell: pwsh
        run: |
          if (-not (Test-Path remotion/out/qr-generator.mp4)) { throw 'Final MP4 was not created.' }
          $duration = [double](& ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 remotion/out/qr-generator.mp4)
          Write-Host "Final MP4 duration: $duration seconds"
          if ($duration -gt 60.25) { throw "Final MP4 exceeds 60 seconds: $duration" }

      - name: Create thumbnail
        working-directory: Reddott-films/knowledge-videos/qr-generator
        shell: pwsh
        run: ffmpeg -y -ss 00:00:05 -i remotion/out/qr-generator.mp4 -frames:v 1 -q:v 2 output/thumbnail.png

      - name: Upload to YouTube with SEO and Smart Toolz playlist
        working-directory: Reddott-films/knowledge-videos/qr-generator
        shell: pwsh
        env:
          VIDEO_PATH: remotion/out/qr-generator.mp4
          THUMBNAIL_PATH: output/thumbnail.png
        run: python "$env:GITHUB_WORKSPACE/Reddott-films/youtube/upload_video.py"

      - name: Save workflow artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qr-generator-video
          if-no-files-found: warn
          path: |
            Reddott-films/knowledge-videos/qr-generator/remotion/out/qr-generator.mp4
            Reddott-films/knowledge-videos/qr-generator/output/thumbnail.png
            Reddott-films/knowledge-videos/qr-generator/output/browser-demo.webm
            Reddott-films/knowledge-videos/qr-generator/output/narration.wav
            Reddott-films/knowledge-videos/qr-generator/output/narration-duration.txt

# This workflow intentionally targets the user's self-hosted Windows PC so the private-repo
# video pipeline does not consume GitHub-hosted Actions minutes. Python is preinstalled on the
# Windows runner instead of using actions/setup-python, avoiding the host's PowerShell policy.
# Upload happens only after the real browser recording, natural narration, and final MP4 pass <=60s checks.
