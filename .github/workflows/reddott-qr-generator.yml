name: Reddott QR Generator Video

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reddott-qr-generator.yml'
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Playwright
        working-directory: Reddott-films/knowledge-videos/qr-generator/recorder
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Record the real SmartToolz page
        working-directory: Reddott-films/knowledge-videos/qr-generator/recorder
        run: node record.js

      - name: Verify browser recording
        working-directory: Reddott-films/knowledge-videos/qr-generator
        run: |
          test -s output/browser-demo.webm
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/browser-demo.webm

      - name: Build narration
        working-directory: Reddott-films/knowledge-videos/qr-generator
        run: node build-narration.mjs

      - name: Prepare Remotion public assets
        working-directory: Reddott-films/knowledge-videos/qr-generator/remotion
        run: |
          mkdir -p public out
          cp ../output/browser-demo.webm public/browser-demo.webm
          cp ../output/narration.wav public/narration.wav
          npm install

      - name: Render final MP4
        working-directory: Reddott-films/knowledge-videos/qr-generator/remotion
        run: npx remotion render src/index.jsx QRGenerator out/qr-generator.mp4 --codec=h264 --crf=23

      - name: Verify final MP4
        working-directory: Reddott-films/knowledge-videos/qr-generator
        run: |
          test -s remotion/out/qr-generator.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 remotion/out/qr-generator.mp4

      - name: Create thumbnail
        working-directory: Reddott-films/knowledge-videos/qr-generator
        run: ffmpeg -y -ss 00:00:08 -i remotion/out/qr-generator.mp4 -frames:v 1 -q:v 2 output/thumbnail.png

      - name: Upload to YouTube
        if: ${{ secrets.YT_CLIENT_ID != '' && secrets.YT_CLIENT_SECRET != '' && secrets.YT_REFRESH_TOKEN != '' }}
        working-directory: Reddott-films/knowledge-videos/qr-generator/youtube-upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_PATH: ../remotion/out/qr-generator.mp4
          THUMBNAIL_PATH: ../output/thumbnail.png
          PUBLISH_META_PATH: ../published/youtube.json
        run: |
          npm install
          node upload.mjs

      - name: Publish YouTube metadata to repository
        if: ${{ secrets.YT_CLIENT_ID != '' && secrets.YT_CLIENT_SECRET != '' && secrets.YT_REFRESH_TOKEN != '' }}
        run: |
          test -s Reddott-films/knowledge-videos/qr-generator/published/youtube.json
          git config user.name 'Reddott Video Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Reddott-films/knowledge-videos/qr-generator/published/youtube.json
          git commit -m 'Publish QR Generator YouTube metadata' || true
          git push

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qr-generator-video
          path: |
            Reddott-films/knowledge-videos/qr-generator/remotion/out/qr-generator.mp4
            Reddott-films/knowledge-videos/qr-generator/output/thumbnail.png
            Reddott-films/knowledge-videos/qr-generator/output/browser-demo.webm
