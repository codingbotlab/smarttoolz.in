name: Reddott QR Generator Video

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reddott-qr-generator.yml'
      - 'Reddott-films/youtube/upload_video.py'
      - 'Reddott-films/knowledge-videos/qr-generator/**'
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write

env:
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright
        working-directory: Reddott-films/knowledge-videos/qr-generator/recorder
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Install Kokoro TTS
        run: |
          python -m venv "$GITHUB_WORKSPACE/tts-venv"
          "$GITHUB_WORKSPACE/tts-venv/bin/python" -m pip install --upgrade pip
          "$GITHUB_WORKSPACE/tts-venv/bin/pip" install "kokoro>=0.9.4" soundfile

      - name: Record the real SmartToolz page
        working-directory: Reddott-films/knowledge-videos/qr-generator/recorder
        run: node record.js

      - name: Verify browser recording is under one minute
        working-directory: Reddott-films/knowledge-videos/qr-generator
        run: |
          test -s output/browser-demo.webm
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/browser-demo.webm)
          echo "Browser recording duration: ${DURATION}s"
          python - "$DURATION" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if duration > 60.25:
              raise SystemExit(f"Browser recording exceeds 60 seconds: {duration:.3f}s")
          PY

      - name: Build natural narration
        working-directory: Reddott-films/knowledge-videos/qr-generator
        env:
          KOKORO_PYTHON: ${{ github.workspace }}/tts-venv/bin/python
          KOKORO_VOICE: af_heart
          KOKORO_SPEED: '1.0'
        run: node build-narration.mjs

      - name: Verify narration is under one minute
        working-directory: Reddott-films/knowledge-videos/qr-generator
        run: |
          test -s output/narration.wav
          test -s output/narration-duration.txt
          cat output/narration-duration.txt
          python - <<'PY'
          from pathlib import Path
          duration = float(Path('output/narration-duration.txt').read_text().strip())
          if duration > 60:
              raise SystemExit(f'Narration exceeds 60 seconds: {duration:.3f}s')
          PY

      - name: Prepare Remotion public assets
        working-directory: Reddott-films/knowledge-videos/qr-generator/remotion
        run: |
          mkdir -p public out
          cp ../output/browser-demo.webm public/browser-demo.webm
          cp ../output/narration.wav public/narration.wav
          cp ../output/narration-duration.txt public/narration-duration.txt
          npm install

      - name: Render final MP4
        working-directory: Reddott-films/knowledge-videos/qr-generator/remotion
        run: npx remotion render src/index.jsx QRGenerator out/qr-generator.mp4 --codec=h264 --crf=23 --concurrency=2 --log=verbose

      - name: Verify final MP4 is under one minute
        working-directory: Reddott-films/knowledge-videos/qr-generator
        run: |
          test -s remotion/out/qr-generator.mp4
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 remotion/out/qr-generator.mp4)
          echo "Final MP4 duration: ${DURATION}s"
          python - "$DURATION" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if duration > 60.25:
              raise SystemExit(f'Final MP4 exceeds 60 seconds: {duration:.3f}s')
          PY

      - name: Create thumbnail
        working-directory: Reddott-films/knowledge-videos/qr-generator
        run: ffmpeg -y -ss 00:00:05 -i remotion/out/qr-generator.mp4 -frames:v 1 -q:v 2 output/thumbnail.png

      - name: Upload to YouTube with SEO and Smart Toolz playlist
        working-directory: Reddott-films/knowledge-videos/qr-generator
        env:
          VIDEO_PATH: remotion/out/qr-generator.mp4
          THUMBNAIL_PATH: output/thumbnail.png
        run: python "$GITHUB_WORKSPACE/Reddott-films/youtube/upload_video.py"

      - name: Upload workflow artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qr-generator-video
          if-no-files-found: warn
          path: |
            Reddott-films/knowledge-videos/qr-generator/remotion/out/qr-generator.mp4
            Reddott-films/knowledge-videos/qr-generator/output/thumbnail.png
            Reddott-films/knowledge-videos/qr-generator/output/browser-demo.webm
            Reddott-films/knowledge-videos/qr-generator/output/narration.wav
            Reddott-films/knowledge-videos/qr-generator/output/narration-duration.txt

# Upload happens only after the real browser recording, natural narration, and final MP4 pass the <=60s checks.
