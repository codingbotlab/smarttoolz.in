name: Remove site-wide trial system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-trials:
    if: contains(github.event.head_commit.message, '[remove-trials]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove trial system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          header = Path('smart-toolz/header.php')
          s = header.read_text()

          s = re.sub(r"\n\$guestTrialEnabled\s*=.*?;\n\$guestTrialTotal\s*=.*?;", "", s, count=1, flags=re.S)
          s = re.sub(r"\n\$guestTrialUsed\s*=.*?;\n\$guestTrialExhausted\s*=.*?;\n\nif \(!\$isLoggedIn && \$isToolPage.*?\n}\n", "\n", s, count=1, flags=re.S)

          old = """    try {\n        require_once $_SERVER['DOCUMENT_ROOT'] . '/smart-toolz/lib/trials.php';\n        if (($_SESSION['smarttoolz_login_notice_sid'] ?? '') !== session_id()) {\n            smarttoolz_notify((int)$_SESSION['user_id'], 'login', 'Login activity', 'You signed in to ' . $siteName . ' successfully.');\n            $_SESSION['smarttoolz_login_notice_sid'] = session_id();\n        }\n    } catch (Throwable $e) {}\n"""
          new = """    try {\n        if (($_SESSION['smarttoolz_login_notice_sid'] ?? '') !== session_id()) {\n            $notify = db()->prepare('INSERT INTO smarttoolz_notifications(user_id,type,title,message) VALUES(?,?,?,?)');\n            $notify->execute([(int)$_SESSION['user_id'], 'login', 'Login activity', 'You signed in to ' . $siteName . ' successfully.']);\n            $_SESSION['smarttoolz_login_notice_sid'] = session_id();\n        }\n    } catch (Throwable $e) {}\n"""
          if old not in s:
              raise SystemExit('header login-notification block not found')
          s = s.replace(old, new, 1)

          # Remove trial lock and the entire trial-note branches, retaining the SEO intro.
          s = re.sub(r"\n<\?php if \(\$isToolPage && !\$isLoggedIn && \$guestTrialEnabled.*?\?>\n.*?\n<\?php else: \?>", "", s, count=1, flags=re.S)
          s = re.sub(r"\n<\?php if \(\$isToolPage && !\$isLoggedIn && \$guestTrialEnabled.*?\n<\?php endif; \?>", "", s, count=1, flags=re.S)

          # Remove all CSS rules whose selectors are dedicated to the old trial UI.
          s = re.sub(r"\.trial-note\{[^}]*\}\.trial-note \.material-symbols-rounded\{[^}]*\}", "", s)
          s = re.sub(r"\.trial-login,.trial-other\{[^}]*\}\.trial-login\{[^}]*\}\.trial-other\{[^}]*\}", "", s)
          s = re.sub(r"\.trial-lock\{[^}]*\}\.trial-lock-icon\{[^}]*\}\.trial-lock-icon \.material-symbols-rounded\{[^}]*\}\.trial-lock h1\{[^}]*\}\.trial-lock p\{[^}]*\}\.trial-lock-actions\{[^}]*\}", "", s)
          s = re.sub(r"\.trial-lock\{[^}]*\}", "", s)
          s = re.sub(r"\.trial-lock-icon\{[^}]*\}", "", s)
          s = re.sub(r"\.trial-lock h1\{[^}]*\}", "", s)
          s = re.sub(r"\.trial-lock h1\{[^}]*\}", "", s)
          s = re.sub(r"\.trial-lock p\{[^}]*\}", "", s)
          s = re.sub(r"\.trial-lock-actions\{[^}]*\}", "", s)
          s = re.sub(r"\.trial-login\{[^}]*\}", "", s)
          s = re.sub(r"\.trial-other\{[^}]*\}", "", s)
          s = re.sub(r"\.trial-note\{[^}]*\}", "", s)
          s = re.sub(r"\.trial-note \.material-symbols-rounded\{[^}]*\}", "", s)
          header.write_text(s)

          api = Path('smart-toolz/api/notifications.php')
          a = api.read_text()
          a = a.replace("require_once dirname(__DIR__) . '/lib/trials.php';", "require_once dirname(__DIR__, 2) . '/creator-ai/auth/config.php';")
          a = a.replace("$userId = smarttoolz_current_user_id();", "$userId = (int)($_SESSION['user_id'] ?? 0);")
          a = a.replace("    smarttoolz_trial_install();\n    $db = smarttoolz_trial_db();", "    $db = db();")
          a = a.replace("smarttoolz_notification_unread_count($userId)", "(function() use ($db, $userId) { $q=$db->prepare('SELECT COUNT(*) FROM smarttoolz_notifications WHERE user_id=? AND read_at IS NULL'); $q->execute([$userId]); return (int)$q->fetchColumn(); })()")
          a = a.replace("smarttoolz_notification_list($userId, 25)", "(function() use ($db, $userId) { $q=$db->prepare('SELECT id,type,title,message,read_at,created_at FROM smarttoolz_notifications WHERE user_id=? ORDER BY id DESC LIMIT 25'); $q->execute([$userId]); return $q->fetchAll(PDO::FETCH_ASSOC); })()")
          api.write_text(a)

          Path('smart-toolz/lib/trials.php').unlink(missing_ok=True)
          Path('smart-toolz/api/trial.php').unlink(missing_ok=True)

          dbsql = Path('creator-ai/auth/database.sql')
          d = dbsql.read_text()
          d = re.sub(r"\nCREATE TABLE IF NOT EXISTS smarttoolz_tool_trials \(.*?\n\) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n", "\n", d, count=1, flags=re.S)
          dbsql.write_text(d)
          PY

          if grep -RIn --exclude-dir=.git -E 'smarttoolz/(lib/trials\.php|api/trial\.php)|smarttoolz_(guest_)?trial|guest_trial_(enabled|limit)' .; then
            echo 'Trial references remain:'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove site-wide trial system'
          git push

          rm -f .github/workflows/remove-trial-system.yml
          git add -A
          git commit -m 'chore: remove trial cleanup workflow'
          git push
