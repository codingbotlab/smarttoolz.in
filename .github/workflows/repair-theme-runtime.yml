name: Repair SmartToolz theme runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair remaining renamed-runtime references
        shell: bash
        run: |
          set -euo pipefail
          ROOT="wordpress/wp-content/themes/smarttoolz-theme"
          MENU="$ROOT/admin/includes/class-smarttoolz-menu.php"
          test -f "$ROOT/functions.php"
          test -f "$MENU"
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import re, sys
          root=Path(sys.argv[1])
          replacements=[
            (r'\bAstra_Menu\b','SmartToolz_Menu'),
            (r'\bAstra_Learn\b','SmartToolz_Learn'),
            (r'\bAstra_Ext_Extension\b','SmartToolz_Ext_Extension'),
            (r'\bAstra_Global_Palette\b','SmartToolz_Global_Palette'),
            (r'\bAstra_Dynamic_CSS\b','SmartToolz_Dynamic_CSS'),
            (r'\bAstra_Theme_Options\b','SmartToolz_Theme_Options'),
            (r'\bAstra_Admin_Loader\b','SmartToolz_Admin_Loader'),
            (r'\bastra_is_white_labelled\b','smarttoolz_is_white_labelled'),
            (r'\bASTRA_EXT_VER\b','SMARTTOOLZ_EXT_VER'),
            (r'\bASTRA_THEME_ORG_VERSION\b','SMARTTOOLZ_THEME_ORG_VERSION'),
            (r'\bASTRA_THEME_ADMIN_DIR\b','SMARTTOOLZ_THEME_ADMIN_DIR'),
            (r'\bASTRA_THEME_ADMIN_URL\b','SMARTTOOLZ_THEME_ADMIN_URL'),
            (r'\bASTRA_THEME_DIR\b','SMARTTOOLZ_THEME_DIR'),
            (r'\bASTRA_THEME_URI\b','SMARTTOOLZ_THEME_URI'),
            (r'\bastra_admin_settings\b','smarttoolz_admin_settings'),
            (r'\bastraPricingVisited\b','smarttoolzPricingVisited'),
            (r'\bastraPricingIntent\b','smarttoolzPricingIntent'),
            (r'\bastraPricingLinkOpen\b','smarttoolzPricingLinkOpen'),
            (r'\bwpastra\.com/pricing\b','smarttoolz.in/pricing'),
            (r"(['\"])astra(['\"])",r'\1smarttoolz\2'),
          ]
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix.lower() not in {'.php','.css','.js','.json','.xml','.html','.htm','.txt','.md','.svg'}:
              continue
            try: s=p.read_text()
            except Exception: continue
            ns=s
            for pat,rep in replacements: ns=re.sub(pat,rep,ns)
            if p.name == 'class-smarttoolz-menu.php':
              if 'function smarttoolz_is_white_labelled()' not in ns:
                marker="if ( ! defined( 'ABSPATH' ) ) {"
                helper="\nif ( ! function_exists( 'smarttoolz_is_white_labelled' ) ) {\n\tfunction smarttoolz_is_white_labelled() { return false; }\n}\n"
                ns=ns.replace(marker, marker+helper, 1)
            if ns != s: p.write_text(ns)
          PY

          # Ensure the helper is present and the known fatal function is absent.
          grep -q 'function smarttoolz_is_white_labelled' "$MENU"
          ! grep -Rni --exclude-dir='.git' 'astra_is_white_labelled' "$ROOT"
          ! grep -Rni --exclude-dir='.git' 'class Astra_Menu' "$ROOT"

          # Validate all PHP syntax.
          find "$ROOT" -type f -name '*.php' -print0 | while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix SmartToolz theme runtime identifiers'
          git push origin HEAD:main