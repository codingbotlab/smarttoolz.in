name: Repair SmartToolz theme runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair remaining renamed-runtime references
        shell: bash
        run: |
          set -euo pipefail
          ROOT="wordpress/wp-content/themes/smarttoolz-theme"
          MENU="$ROOT/admin/includes/class-smarttoolz-menu.php"
          test -f "$ROOT/functions.php"
          test -f "$MENU"
          python3 - "$ROOT" <<'PY'
from pathlib import Path
import sys
root = Path(sys.argv[1])
replacements = {
    'Astra_Ext_Extension': 'SmartToolz_Ext_Extension',
    'Astra_Menu': 'SmartToolz_Menu',
    'Astra_Admin_Loader': 'SmartToolz_Admin_Loader',
    'Astra_Global_Palette': 'SmartToolz_Global_Palette',
    'Astra_Dynamic_CSS': 'SmartToolz_Dynamic_CSS',
    'Astra_Theme_Options': 'SmartToolz_Theme_Options',
    'Astra_Learn': 'SmartToolz_Learn',
    'astra_is_white_labelled': 'smarttoolz_is_white_labelled',
    'ASTRA_EXT_VER': 'SMARTTOOLZ_EXT_VER',
    'ASTRA_THEME_ORG_VERSION': 'SMARTTOOLZ_THEME_ORG_VERSION',
    'ASTRA_THEME_ADMIN_DIR': 'SMARTTOOLZ_THEME_ADMIN_DIR',
    'ASTRA_THEME_ADMIN_URL': 'SMARTTOOLZ_THEME_ADMIN_URL',
    'ASTRA_THEME_DIR': 'SMARTTOOLZ_THEME_DIR',
    'ASTRA_THEME_URI': 'SMARTTOOLZ_THEME_URI',
    'astra_admin_settings': 'smarttoolz_admin_settings',
    'astraPricingVisited': 'smarttoolzPricingVisited',
    'astraPricingIntent': 'smarttoolzPricingIntent',
    'astraPricingLinkOpen': 'smarttoolzPricingLinkOpen',
    'wpastra.com/pricing': 'smarttoolz.in/pricing',
}
text_exts = {'.php','.css','.js','.json','.xml','.html','.htm','.txt','.md','.svg'}
for p in root.rglob('*'):
    if not p.is_file() or p.suffix.lower() not in text_exts:
        continue
    try:
        s = p.read_text()
    except Exception:
        continue
    ns = s
    for old, new in replacements.items():
        ns = ns.replace(old, new)
    if p.name == 'class-smarttoolz-menu.php' and 'function smarttoolz_is_white_labelled' not in ns:
        marker = "if ( ! defined( 'ABSPATH' ) ) {"
        helper = "\nif ( ! function_exists( 'smarttoolz_is_white_labelled' ) ) {\n\tfunction smarttoolz_is_white_labelled() { return false; }\n}\n"
        ns = ns.replace(marker, marker + helper, 1)
    if ns != s:
        p.write_text(ns)
PY

          grep -q 'function smarttoolz_is_white_labelled' "$MENU"
          ! grep -Rni --exclude-dir='.git' 'astra_is_white_labelled' "$ROOT"
          ! grep -Rni --exclude-dir='.git' 'class Astra_Menu' "$ROOT"
          find "$ROOT" -type f -name '*.php' -print0 | while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix SmartToolz theme runtime identifiers'
          git push origin HEAD:main
