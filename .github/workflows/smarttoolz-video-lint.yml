name: SmartToolz Video Quality Gate
on:
  push:
    branches: [ main ]
    paths:
      - 'wordpress/wp-content/plugins/smarttoolz-video/**'
  workflow_dispatch:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required plugin files
        run: |
          test -f wordpress/wp-content/plugins/smarttoolz-video/smarttoolz-video.php
          test -f wordpress/wp-content/plugins/smarttoolz-video/includes/platform.php
          test -f wordpress/wp-content/plugins/smarttoolz-video/includes/pages.php
          test -f wordpress/wp-content/plugins/smarttoolz-video/assets/js/video.js
          test -f wordpress/wp-content/plugins/smarttoolz-video/assets/css/video.css
      - name: Lint plugin PHP
        run: |
          set -e
          find wordpress/wp-content/plugins/smarttoolz-video -type f -name '*.php' -print0 | xargs -0 -n1 php -l
