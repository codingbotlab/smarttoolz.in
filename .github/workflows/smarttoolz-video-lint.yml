name: SmartToolz Video Quality Gate
on:
  push:
    branches: [ main ]
    paths:
      - 'wordpress/wp-content/plugins/smarttoolz-video/**'
  workflow_dispatch:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin entry point
        run: test -f wordpress/wp-content/plugins/smarttoolz-video/smarttoolz-video.php
      - name: Lint plugin PHP
        run: |
          set -e
          find wordpress/wp-content/plugins/smarttoolz-video -type f -name '*.php' -print0 | xargs -0 -n1 php -l
