name: SmartToolz Video Renderer

on:
  workflow_dispatch:
    inputs:
      tutorial_slug:
        description: Tool slug from video/tutorials.json
        required: true
        default: image-background-remover
        type: string
      format:
        description: Output format
        required: true
        default: landscape
        type: choice
        options: [landscape, portrait]
      voice:
        description: Male neural voice
        required: true
        default: hi-IN-MadhurNeural
        type: choice
        options: [hi-IN-MadhurNeural, en-IN-PrabhatNeural, en-US-GuyNeural]
  push:
    paths:
      - 'smart-toolz/tools/**'
      - 'video/**'
      - '.github/workflows/video-remotion.yml'

permissions:
  contents: write

jobs:
  render:
    name: Record, narrate and render tutorial
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    env:
      TUTORIAL_SLUG: ${{ inputs.tutorial_slug || 'image-background-remover' }}
      SMARTTOOLZ_BASE_URL: https://smarttoolz.in
      VIDEO_FORMAT: ${{ inputs.format || 'landscape' }}
      VIDEO_VOICE: ${{ inputs.voice || 'hi-IN-MadhurNeural' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video/package.json

      - name: Check system Python
        shell: pwsh
        run: |
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 --version
          } elseif (Get-Command python -ErrorAction SilentlyContinue) {
            python --version
          } else {
            throw 'Python 3 is required on the self-hosted runner.'
          }

      - name: Install Remotion dependencies
        working-directory: video
        run: npm install --no-audit --no-fund

      - name: Install browser recording tools
        shell: pwsh
        run: |
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 -m pip install --upgrade pip edge-tts mutagen pillow playwright
            py -3 -m playwright install chromium
          } else {
            python -m pip install --upgrade pip edge-tts mutagen pillow playwright
            python -m playwright install chromium
          }

      - name: Create demo input image
        shell: pwsh
        run: |
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 -c "from PIL import Image,ImageDraw; from pathlib import Path; p=Path('video/fixtures'); p.mkdir(parents=True,exist_ok=True); im=Image.new('RGB',(1000,700),'white'); d=ImageDraw.Draw(im); d.rounded_rectangle((110,90,890,610),radius=36,fill=(98,91,255)); d.ellipse((360,170,640,450),fill=(255,190,80)); d.rounded_rectangle((300,455,700,545),radius=24,fill=(25,32,55)); d.text((330,570),'SMARTTOOLZ DEMO IMAGE',fill=(25,32,55)); im.save(p/'background-remover-demo.png')"
          } else {
            python -c "from PIL import Image,ImageDraw; from pathlib import Path; p=Path('video/fixtures'); p.mkdir(parents=True,exist_ok=True); im=Image.new('RGB',(1000,700),'white'); d=ImageDraw.Draw(im); d.rounded_rectangle((110,90,890,610),radius=36,fill=(98,91,255)); d.ellipse((360,170,640,450),fill=(255,190,80)); d.rounded_rectangle((300,455,700,545),radius=24,fill=(25,32,55)); d.text((330,570),'SMARTTOOLZ DEMO IMAGE',fill=(25,32,55)); im.save(p/'background-remover-demo.png')"
          }

      - name: Generate tutorial script automatically
        working-directory: video
        shell: pwsh
        run: |
          if (Get-Command py -ErrorAction SilentlyContinue) { py -3 generate_tutorial.py } else { python generate_tutorial.py }
          $p = Get-Content -Raw public/job.json | ConvertFrom-Json
          $p.base_url = $env:SMARTTOOLZ_BASE_URL
          $p.voice = $env:VIDEO_VOICE
          $p.format = $env:VIDEO_FORMAT
          $p | ConvertTo-Json -Depth 20 | Set-Content public/job.json -Encoding UTF8

      - name: Generate realistic male narration
        working-directory: video
        shell: pwsh
        run: if (Get-Command py -ErrorAction SilentlyContinue) { py -3 generate_audio.py } else { python generate_audio.py }

      - name: Record real tool interaction in Chromium
        working-directory: video
        shell: pwsh
        run: if (Get-Command py -ErrorAction SilentlyContinue) { py -3 record_tutorial.py } else { python record_tutorial.py }

      - name: Attach recording to narration
        working-directory: video
        shell: pwsh
        run: if (Get-Command py -ErrorAction SilentlyContinue) { py -3 attach_recording.py } else { python attach_recording.py }

      - name: Ensure Remotion browser
        working-directory: video
        run: npx remotion browser ensure

      - name: Render synced MP4 with Remotion
        working-directory: video
        shell: pwsh
        run: |
          $props = Get-Content -Raw public/render-props.json
          New-Item -ItemType Directory -Force ../video-library | Out-Null
          npx remotion render src/index.ts Video ../video-library/tutorial.mp4 --codec=h264 --crf=18 --concurrency=2 --props=$props

      - name: Publish generated video into Git
        shell: pwsh
        run: |
          $config = Get-Content -Raw video/tutorials.json | ConvertFrom-Json
          $dest = $config.($env:TUTORIAL_SLUG).output
          New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
          Copy-Item video-library/tutorial.mp4 $dest -Force
          git config user.name "smarttoolz-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add $dest
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'No video changes to commit' } else { git commit -m "Generate $env:TUTORIAL_SLUG tutorial video"; git push }

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarttoolz-${{ env.TUTORIAL_SLUG }}-tutorial
          path: video-library/tutorial.mp4
          retention-days: 14
