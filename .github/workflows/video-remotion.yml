name: SmartToolz Video Renderer

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        type: string
      script:
        description: Full tutorial narration script
        required: true
        type: string
      voice:
        description: Male neural voice
        required: true
        default: hi-IN-MadhurNeural
        type: choice
        options:
          - hi-IN-MadhurNeural
          - en-IN-PrabhatNeural
          - en-US-GuyNeural
      format:
        description: Output format
        required: true
        default: landscape
        type: choice
        options:
          - landscape
          - portrait

permissions:
  contents: read

jobs:
  render:
    name: Generate narrated tutorial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_SCRIPT: ${{ inputs.script }}
      VIDEO_VOICE: ${{ inputs.voice }}
      VIDEO_FORMAT: ${{ inputs.format }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Remotion dependencies
        working-directory: video
        run: npm install --no-audit --no-fund

      - name: Install Edge TTS
        run: python -m pip install --upgrade pip edge-tts

      - name: Prepare narration job
        working-directory: video
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          job = {
            'title': os.environ['VIDEO_TITLE'],
            'script': os.environ['VIDEO_SCRIPT'],
            'voice': os.environ['VIDEO_VOICE'],
            'format': os.environ['VIDEO_FORMAT'],
          }
          Path('public').mkdir(parents=True, exist_ok=True)
          Path('public/job.json').write_text(json.dumps(job, ensure_ascii=False), encoding='utf-8')
          PY
          python generate_audio.py

      - name: Ensure Remotion browser
        working-directory: video
        run: npx remotion browser ensure

      - name: Render MP4 with Remotion
        working-directory: video
        shell: bash
        run: |
          PROPS=$(node -e "process.stdout.write(JSON.stringify(require('./public/render-props.json')))" )
          npx remotion render src/index.ts Video out/smarttoolz-video.mp4 --codec=h264 --crf=18 --concurrency=2 --props="$PROPS"

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: smarttoolz-video-${{ github.run_number }}
          path: |
            video/out/smarttoolz-video.mp4
            video/public/render-props.json
          if-no-files-found: error
          retention-days: 14
