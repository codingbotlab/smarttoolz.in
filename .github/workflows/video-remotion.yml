name: SmartToolz Video Renderer

on:
  workflow_dispatch:
    inputs:
      tutorial_slug:
        description: Tool slug from video/tutorials.json
        required: true
        default: image-background-remover
        type: string
      format:
        description: Output format
        required: true
        default: landscape
        type: choice
        options: [landscape, portrait]
      voice:
        description: Male neural voice
        required: true
        default: hi-IN-MadhurNeural
        type: choice
        options: [hi-IN-MadhurNeural, en-IN-PrabhatNeural, en-US-GuyNeural]
  push:
    paths:
      - 'smart-toolz/tools/**'
      - 'video/**'
      - '.github/workflows/video-remotion.yml'

permissions:
  contents: write

jobs:
  render:
    name: Record, narrate and render tutorial
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    env:
      TUTORIAL_SLUG: ${{ inputs.tutorial_slug || 'image-background-remover' }}
      SMARTTOOLZ_BASE_URL: https://smarttoolz.in
      VIDEO_FORMAT: ${{ inputs.format || 'landscape' }}
      VIDEO_VOICE: ${{ inputs.voice || 'hi-IN-MadhurNeural' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Remotion dependencies
        working-directory: video
        run: npm install --no-audit --no-fund

      - name: Install browser recording tools
        run: |
          python -m pip install --upgrade pip edge-tts mutagen pillow playwright
          python -m playwright install chromium

      - name: Create demo input image
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          p=Path('video/fixtures'); p.mkdir(parents=True,exist_ok=True)
          im=Image.new('RGB',(1000,700),'white'); d=ImageDraw.Draw(im)
          d.rounded_rectangle((110,90,890,610),radius=36,fill=(98,91,255))
          d.ellipse((360,170,640,450),fill=(255,190,80))
          d.rounded_rectangle((300,455,700,545),radius=24,fill=(25,32,55))
          d.text((330,570),'SMARTTOOLZ DEMO IMAGE',fill=(25,32,55))
          im.save(p/'background-remover-demo.png')
          PY

      - name: Generate tutorial script automatically
        working-directory: video
        run: |
          python generate_tutorial.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('public/job.json'); j=json.loads(p.read_text())
          j['base_url']=os.environ['SMARTTOOLZ_BASE_URL']
          j['voice']=os.environ['VIDEO_VOICE']
          j['format']=os.environ['VIDEO_FORMAT']
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Generate realistic male narration
        working-directory: video
        run: python generate_audio.py

      - name: Record real tool interaction in Chromium
        working-directory: video
        run: python record_tutorial.py

      - name: Attach recording frames to narration
        working-directory: video
        run: python attach_recording.py

      - name: Ensure Remotion browser
        working-directory: video
        run: npx remotion browser ensure

      - name: Render synced MP4 with Remotion
        working-directory: video
        run: |
          PROPS=$(node -e "process.stdout.write(JSON.stringify(require('./public/render-props.json')))" )
          mkdir -p "../video-library"
          npx remotion render src/index.ts Video "../video-library/tutorial.mp4" --codec=h264 --crf=18 --concurrency=2 --props="$PROPS"

      - name: Publish generated video into Git
        run: |
          DEST=$(python - <<'PY'
          import json, os
          print(json.load(open('video/tutorials.json'))[os.environ['TUTORIAL_SLUG']]['output'])
          PY
          )
          mkdir -p "$(dirname "$DEST")"
          cp video-library/tutorial.mp4 "$DEST"
          git config user.name "smarttoolz-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then echo "No video changes to commit"; else git commit -m "Generate $TUTORIAL_SLUG tutorial video"; git push; fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarttoolz-${{ env.TUTORIAL_SLUG }}-tutorial
          path: video-library/tutorial.mp4
          retention-days: 14
