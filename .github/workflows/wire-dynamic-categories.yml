name: Wire Dynamic Tool Categories

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[dynamic-categories]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch tool registry
        run: python scripts/patch-dynamic-categories.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-toolz/tool.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire database-backed tool categories [dynamic-categories]'
          git push
